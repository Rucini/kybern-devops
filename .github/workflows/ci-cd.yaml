name: build and deploy

on:
   push


jobs: 
     build-backend:
        runs-on: ubuntu-latest
        steps:
            - name: checkout source code
              uses: actions/checkout@v7

            - name: install  dependencies
              working-directory: ./backend
              run: pip install -r requirements.txt

            - name: Lint
              working-directory: ./backend
              run: flask8

            - name: test
              working-directory: ./backend
              run: pytest



                