name: build and deploy

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main       


jobs: 
     build:
        runs-on: ubuntu-latest
        outputs:
            sha_tag: ${{ steps.vars.outputs.sha_tag }}
        steps:
            - name: checkout source code
              uses: actions/checkout@v7

            - name: install  dependencies
              working-directory: ./frontend
              run: npm install
          
            - name: set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: login to DockerHub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: determine SHA tag
              id: vars
              run: echo "sha_tag=$(GITHUB_SHA::7)" >> $GITHUB_OUTPUT


            - name: build and push docker images
              uses: docker/build-push-action@v7
              with:
                context: ./frontend
                file: ./frontend/Dockerfile
                push: ${{ github.event_name == 'push' }}
                load: ${{ github.event_name != 'push' }}
                tags: rucini/helpdesk:frontend-v1:${{ steps.vars.outputs.sha_tag }} #your dockerhub username/repo name:tag




 